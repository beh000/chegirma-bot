# Системные библиотеки для headless Chromium (Playwright). Без этого файла
# "playwright install --with-deps" в postinstall (package.json) не докатывает
# нужные .so в финальный рантайм-образ Railway/Nixpacks — Chromium падает с
# "error while loading shared libraries: libglib-2.0.so.0: cannot open
# shared object file" при попытке запуска (проверено вживую).
[phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libdbus-1-3",
  "libxcb1",
  "libxkbcommon0",
  "libx11-6",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2",
  "libatspi2.0-0",
  "libwayland-client0"
]
